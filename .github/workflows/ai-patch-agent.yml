name: AI Patch Agent
on:
  push:
    branches: ["ai/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  build-patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate patch.zip
        shell: pwsh
        run: pwsh -File ops/ai_patchbot.ps1 -TaskId UH001 -OutDir _ai_out
      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch_zip
          path: _ai_out/patch_*.zip
          if-no-files-found: error